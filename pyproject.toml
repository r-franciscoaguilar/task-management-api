[project]
name = "task-management-api"
version = "0.1.0"
description = "Task Management API — Software Engineer III take-home assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Local SMTP server, used two ways: `python -m aiosmtpd` to watch real
    # emails arrive during manual testing, and an in-process instance in the
    # test suite to prove delivery actually crosses a socket.
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
